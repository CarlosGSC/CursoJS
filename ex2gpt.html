<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variáveis e Tipos de Dados</title>
</head>
<body>
    <script>
        let nome = "Carlos";
        let idade = 24;
        let peso = 110;

        // Exibindo na página
        document.write(`<h1 style="color: blue; font-family: Arial;">Meu nome é ${nome}, tenho ${idade} anos e peso ${peso} kg.</h1>`);

        // Exibindo no console
        console.log(`Meu nome é ${nome}, tenho ${idade} anos e peso ${peso} kg.`);
    </script>
</body>
</html>
