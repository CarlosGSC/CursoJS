<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual país</title>
</head>
<body>
    Digite o seu país: <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Enviar" onclick=seupais()>
    <div id="res">

    </div>

    <script>
        function seupais(){
            var txtp=window.document.querySelector('input#txtpais')
            var res=window.document.querySelector('div#res')
            var pais=txtp.value
            res.innerHTML = `<p>Seu país é: <strong>${pais}</strong></p>`
            if(pais=='Brasil'){
                res.innerHTML += `<p>Você é brasileiro!</p>`
            }else{
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }

    </script>

</body>
</html>
