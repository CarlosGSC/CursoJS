<!--  
Questão 3 - Interação com o Usuário
Crie um script que peça ao usuário para inserir o nome dele e, em seguida, exiba um alerta com a seguinte mensagem:

"Olá, [nome]! Seja bem-vindo!" 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interação com o usuário</title>
</head>
<body>
    <script>
        var name = window.prompt('Digite o seu nome: ')
        window.document.write(`<h2>Olá, ${name}! Seja bem-vindo!</h2>`)
    </script>
    
</body>
</html>
